[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "stat906-adaptive-cv"
version = "0.1.0"
description = "Reproducible LSMC and martingale control-variate option experiments"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
